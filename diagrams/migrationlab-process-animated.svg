<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 42px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .sub { font: 400 20px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .node-title { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .node-sub { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #64748b; text-anchor: middle; }
      .lane { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.5; rx: 20; }
      .lane2 { fill: #ecfdf5; stroke: #bbf7d0; stroke-width: 1.5; rx: 20; }
      .lane3 { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5; rx: 20; }
      .label { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .line { fill: none; stroke: #2563eb; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 12 18; animation: flow 1.4s linear infinite; }
      .line2 { fill: none; stroke: #16a34a; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 12 18; animation: flow 1.4s linear infinite; }
      .line3 { fill: none; stroke: #ea580c; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 12 18; animation: flow 1.4s linear infinite; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; transform-origin: center; }
      .step1 { animation-delay: 0s; }
      .step2 { animation-delay: .25s; }
      .step3 { animation-delay: .5s; }
      .step4 { animation-delay: .75s; }
      .step5 { animation-delay: 1s; }
      .step6 { animation-delay: 1.25s; }
      .badge { fill: #0f172a; }
      .badgeText { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      @keyframes flow { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }
      @keyframes pulse {
        0%, 100% { filter: drop-shadow(0 0 0 rgba(37,99,235,0)); transform: scale(1); }
        50% { filter: drop-shadow(0 10px 18px rgba(37,99,235,.24)); transform: scale(1.025); }
      }
    </style>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>
  <rect x="0" y="0" width="1600" height="18" fill="#2563eb"/>
  <text class="title" x="70" y="72">MigrationLab: ERP + CRM Consolidation Flow</text>
  <text class="sub" x="72" y="112">snapshot -> normalize -> match -> survive -> target model -> SAP-shaped target -> reconcile/test</text>

  <rect class="lane" x="55" y="155" width="1490" height="165"/>
  <text class="label" x="80" y="188">1. Source systems and snapshots</text>

  <rect class="lane2" x="55" y="365" width="1490" height="240"/>
  <text class="label" x="80" y="398">2. Working layer: normalization, matching, survivorship, crosswalk</text>

  <rect class="lane3" x="55" y="650" width="1490" height="170"/>
  <text class="label" x="80" y="683">3. Target load, observability, reconciliation evidence</text>

  <!-- Row 1 nodes -->
  <g class="pulse step1">
    <rect class="node" x="90" y="215" width="210" height="78"/>
    <text class="node-title" x="195" y="250">Northwind</text>
    <text class="node-sub" x="195" y="274">ERP-like source</text>
  </g>
  <g class="pulse step1">
    <rect class="node" x="90" y="685" width="210" height="78" opacity="0"/>
  </g>
  <g class="pulse step1">
    <rect class="node" x="90" y="305" width="210" height="0" opacity="0"/>
  </g>
  <g class="pulse step1">
    <rect class="node" x="90" y="215" width="210" height="78" opacity="0"/>
  </g>
  <g class="pulse step1">
    <rect class="node" x="90" y="215" width="210" height="78" opacity="0"/>
  </g>
  <g class="pulse step1">
    <rect class="node" x="340" y="215" width="210" height="78"/>
    <text class="node-title" x="445" y="250">CsvRaw</text>
    <text class="node-sub" x="445" y="274">CRM-style export</text>
  </g>
  <g class="pulse step2">
    <rect class="node" x="640" y="215" width="260" height="78"/>
    <text class="node-title" x="770" y="250">Snapshots</text>
    <text class="node-sub" x="770" y="274">point-in-time copies</text>
  </g>
  <path class="line" marker-end="url(#arrowBlue)" d="M300 255 C390 255, 515 255, 635 255"/>
  <path class="line" marker-end="url(#arrowBlue)" d="M550 255 C575 255, 600 255, 635 255"/>

  <!-- Working row -->
  <g class="pulse step3">
    <rect class="node" x="110" y="455" width="230" height="88"/>
    <text class="node-title" x="225" y="493">Canonical</text>
    <text class="node-sub" x="225" y="518">clean names, phones, countries</text>
  </g>
  <g class="pulse step3">
    <rect class="node" x="420" y="455" width="230" height="88"/>
    <text class="node-title" x="535" y="493">Match Keys</text>
    <text class="node-sub" x="535" y="518">email, phone, name+city</text>
  </g>
  <g class="pulse step4">
    <rect class="node" x="730" y="455" width="230" height="88"/>
    <text class="node-title" x="845" y="493">Survivorship</text>
    <text class="node-sub" x="845" y="518">winner + reason code</text>
  </g>
  <g class="pulse step4">
    <rect class="node" x="1040" y="455" width="230" height="88"/>
    <text class="node-title" x="1155" y="493">Crosswalk</text>
    <text class="node-sub" x="1155" y="518">source IDs to target IDs</text>
  </g>
  <path class="line2" marker-end="url(#arrowGreen)" d="M770 294 C770 350, 225 360, 225 450"/>
  <path class="line2" marker-end="url(#arrowGreen)" d="M340 499 L415 499"/>
  <path class="line2" marker-end="url(#arrowGreen)" d="M650 499 L725 499"/>
  <path class="line2" marker-end="url(#arrowGreen)" d="M960 499 L1035 499"/>

  <!-- Target row -->
  <g class="pulse step5">
    <rect class="node" x="180" y="715" width="260" height="78"/>
    <text class="node-title" x="310" y="750">Target Model</text>
    <text class="node-sub" x="310" y="774">per-attribute rules</text>
  </g>
  <g class="pulse step5">
    <rect class="node" x="540" y="715" width="260" height="78"/>
    <text class="node-title" x="670" y="750">SAP-shaped Target</text>
    <text class="node-sub" x="670" y="774">customer/vendor masters</text>
  </g>
  <g class="pulse step6">
    <rect class="node" x="900" y="715" width="260" height="78"/>
    <text class="node-title" x="1030" y="750">Observability</text>
    <text class="node-sub" x="1030" y="774">RunLog + RejectLog</text>
  </g>
  <g class="pulse step6">
    <rect class="node" x="1260" y="715" width="230" height="78"/>
    <text class="node-title" x="1375" y="750">Tests</text>
    <text class="node-sub" x="1375" y="774">6/6 assertions pass</text>
  </g>
  <path class="line3" marker-end="url(#arrowOrange)" d="M1155 544 C1155 640, 310 640, 310 710"/>
  <path class="line3" marker-end="url(#arrowOrange)" d="M440 754 L535 754"/>
  <path class="line3" marker-end="url(#arrowOrange)" d="M800 754 L895 754"/>
  <path class="line3" marker-end="url(#arrowOrange)" d="M1160 754 L1255 754"/>

  <!-- Badges -->
  <g>
    <circle class="badge" cx="1510" cy="70" r="34"/>
    <text class="badgeText" x="1510" y="70">100%</text>
    <text class="node-sub" x="1510" y="118">reconciled</text>
  </g>
  <g>
    <circle class="badge" cx="1425" cy="70" r="34" fill="#16a34a"/>
    <text class="badgeText" x="1425" y="70">33</text>
    <text class="node-sub" x="1425" y="118">steps</text>
  </g>
</svg>
