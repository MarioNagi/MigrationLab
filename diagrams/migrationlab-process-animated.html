<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MigrationLab Animated Process Diagram</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0f172a;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .stage {
      width: min(96vw, 1600px);
      aspect-ratio: 16 / 9;
      background: #f8fafc;
      box-shadow: 0 30px 80px rgba(0,0,0,.35);
      overflow: hidden;
    }
    object {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="stage">
    <object data="./migrationlab-process-animated.svg" type="image/svg+xml" aria-label="Animated MigrationLab process diagram"></object>
  </main>
</body>
</html>
